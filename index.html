<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Landing Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Step 1: Header element -->
  <header id="header">
    <!-- Logo image -->
    <img id="header-img" src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Example.jpg" alt="Logo">

    <!-- ✅ Navbar inside header -->
    <nav id="nav-bar">
      <a class="nav-link" href="#features">Features</a>
      <a class="nav-link" href="#video-section">Video</a>
      <a class="nav-link" href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Features section -->
  <section id="features">
    <h2>Our Product Features</h2>
    <p>Feature 1: High quality design.</p>
    <p>Feature 2: Affordable pricing.</p>
    <p>Feature 3: Excellent customer support.</p>
  </section>

  <!-- Video section -->
  <section id="video-section">
    <h2>Watch Our Product Demo</h2>
    <iframe id="video" width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      title="Product Demo" frameborder="0" allowfullscreen></iframe>
  </section>

  <!-- Contact form -->
  <section id="contact">
    <h2>Stay Updated</h2>
    <form id="form" action="https://www.freecodecamp.org/email-submit">
      <input id="email" type="email" name="email" placeholder="Enter your email" required>
      <input id="submit" type="submit" value="Subscribe">
    </form>
  </section>
</body>
</html>
